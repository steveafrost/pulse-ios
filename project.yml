name: ThirdHand
options:
  bundleIdPrefix: com.steveafrost
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 4QJ25Y85MX
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # Single source of truth for the version pair. MARKETING_VERSION is edited by
    # hand; CURRENT_PROJECT_VERSION is bumped by Scripts/bump-build.sh and by the
    # fastlane beta lane. Never hardcode either in Info.plist (see docs/RELEASE.md).
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
  # Release hardening (issue #35). Release-only: whole-module optimization makes
  # Debug slow and undebuggable, and dSYMs are only wanted for shipped builds.
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      VALIDATE_PRODUCT: YES
      ENABLE_TESTABILITY: NO

packages:
  ThirdHandCore:
    path: ThirdHandCore

targets:
  ThirdHand:
    type: application
    platform: iOS
    sources:
      - path: ThirdHand
    dependencies:
      - package: ThirdHandCore
      - target: ThirdHandWidgets
        embed: true
      - target: ThirdHandShare
        embed: true
    info:
      path: ThirdHand/Info.plist
      properties:
        CFBundleDisplayName: Third Hand
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The app is universal (UIDeviceFamily 1,2). App Store validation rejects
        # a portrait-only iPhone list without all four iPad orientations, because
        # iPad multitasking requires it. Keep the iPhone experience portrait; let
        # iPad rotate rather than dropping iPad support the board is designed for.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: Third Hand reads your calendar to show what needs a reply, a decision or your attention. Nothing leaves your device.
        NSRemindersFullAccessUsageDescription: Third Hand reads your reminders so overdue and due-today tasks show up on your board. Nothing leaves your device.
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.steveafrost.thirdhand.refresh
        CFBundleURLTypes:
          - CFBundleURLName: com.steveafrost.thirdhand
            CFBundleURLSchemes: [thirdhand]
    entitlements:
      path: ThirdHand/ThirdHand.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.steveafrost.thirdhand
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.steveafrost.thirdhand
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.steveafrost.thirdhand
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steveafrost.thirdhand
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  ThirdHandWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ThirdHandWidgets
    dependencies:
      - package: ThirdHandCore
    info:
      path: ThirdHandWidgets/Info.plist
      properties:
        CFBundleDisplayName: Third Hand
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ThirdHandWidgets/ThirdHandWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.steveafrost.thirdhand
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steveafrost.thirdhand.widgets

  # M7.1. The Share Extension is the honest on-device capture path for Slack,
  # Gmail and GitHub: no OAuth app exists for Third Hand, so the user hands it a link
  # and the app turns that link into an item. It shares the app group with the
  # app (that is the only channel it has) and depends on ThirdHandCore for the
  # `SharedLinkWriter`, so the write format cannot drift from the reader.
  ThirdHandShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ThirdHandShare
    dependencies:
      - package: ThirdHandCore
    info:
      path: ThirdHandShare/Info.plist
      properties:
        CFBundleDisplayName: Third Hand
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ThirdHandShare/ThirdHandShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.steveafrost.thirdhand
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steveafrost.thirdhand.share
        # The extension has no Auto Layout-heavy chrome; keep it lean.
        SKIP_INSTALL: YES

  ThirdHandTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ThirdHandTests
    dependencies:
      - package: ThirdHandCore
      - target: ThirdHand
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steveafrost.thirdhand.tests
        # Without this, `xcodebuild test` fails before running a single test:
        # "Cannot code sign because the target does not have an Info.plist file".
        # CI hid it by passing CODE_SIGNING_ALLOWED=NO, so the documented command
        # only worked with a flag nobody would guess.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ThirdHand:
    build:
      targets:
        ThirdHand: all
        ThirdHandWidgets: all
        ThirdHandShare: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ThirdHandTests
    archive:
      config: Release
